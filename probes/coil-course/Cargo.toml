# Standalone on purpose, same reasoning as probes/dettrig-accuracy/Cargo.toml:
# the empty [workspace] table excludes this crate from the root workspace, so a
# probe can never perturb what the shipped build resolves.
[workspace]

[package]
name = "coil-course"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "coil"
path = "src/main.rs"

[dependencies]
# The real simulation and the real tracer, as path dependencies rather than
# transcriptions. The whole value of this probe is that the numbers it reports
# come from the code that will run the course, not from a model of it.
straf3-sim = { path = "../../crates/straf3-sim" }
straf3-collision = { path = "../../crates/straf3-collision" }
# H6 only, and deliberately: that phase's whole question is whether the
# *shipped* compiler's `CompiledMap::collider()` hands the timing volumes over,
# so it has to be the shipped compiler and not this file's second derivation.
# H1-H5 do not touch it and keep their independence.
straf3-map = { path = "../../crates/straf3-map" }

# The parser straf3-map uses. This probe deliberately does NOT use straf3-map:
# it was written while C7 was still in flight, and its brush->hull path is an
# independent second derivation of the same compile step, which is what makes
# it able to disagree with mapc's.
quake-map = "0.6.1"
