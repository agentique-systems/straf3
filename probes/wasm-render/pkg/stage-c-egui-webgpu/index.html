<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>straf3 — wasm render probe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd;
                   font: 13px/1.5 ui-monospace, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #log { position: fixed; left: 8px; top: 8px; z-index: 1;
             white-space: pre-wrap; text-shadow: 0 0 3px #000; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <canvas id="straf3-canvas" width="1280" height="720"></canvas>
    <script type="module">
      // Mirror everything into the DOM so `chrome --headless --dump-dom` can
      // read it back without a devtools-protocol client.
      const el = document.getElementById("log");
      const say = (s) => { el.textContent += s + "\n"; };
      for (const k of ["log", "info", "warn", "error"]) {
        const orig = console[k].bind(console);
        console[k] = (...a) => { say(`[${k}] ${a.join(" ")}`); orig(...a); };
      }
      window.addEventListener("error", (e) => say(`[uncaught] ${e.message}`));

      say(`PROBE navigator.gpu=${!!navigator.gpu}`);
      try {
        const c = document.createElement("canvas");
        say(`PROBE webgl2=${!!c.getContext("webgl2")}`);
      } catch (e) { say(`PROBE webgl2=err ${e}`); }

      if (navigator.gpu) {
        try {
          const a = await navigator.gpu.requestAdapter();
          say(`PROBE webgpu_adapter=${a ? "yes" : "null"}`);
        } catch (e) { say(`PROBE webgpu_adapter=err ${e}`); }
      }

      // wgpu will NOT fall back from WebGPU to WebGL2 by itself — if
      // navigator.gpu exists but yields no adapter, its WebGPU backend throws.
      // So the host decides the backend, here, before entering wasm.
      const forced = new URLSearchParams(location.search).get("backend");
      let backend = forced;
      if (!backend) {
        let ok = false;
        try { ok = !!(navigator.gpu && (await navigator.gpu.requestAdapter())); } catch {}
        backend = ok ? "webgpu" : "webgl";
      }
      say(`PROBE chosen_backend=${backend}`);

      const t0 = performance.now();
      import("./straf3_wasm_render_probe.js")
        .then((m) => m.default().then(() => m.start_web(backend)))
        .then(() => say(`PROBE init_returned t=${(performance.now() - t0) | 0}ms`))
        .catch((e) => {
          // winit's web backend throws a sentinel to unwind out of spawn_app.
          // That is expected control flow on this platform, not a failure.
          const s = `${e}`;
          if (s.includes("Using exceptions for control flow")) {
            say(`PROBE started_ok t=${(performance.now() - t0) | 0}ms (winit control-flow unwind)`);
          } else {
            say(`PROBE init_failed ${s}`);
          }
        });

      // Give the async device request time to land, then report what rendered.
      setTimeout(() => {
        const cv = document.getElementById("straf3-canvas");
        say(`PROBE canvas=${cv.width}x${cv.height}`);
        // Read the actual pixel the GPU produced, so "it rendered" is
        // measured rather than assumed.
        try {
          const off = document.createElement("canvas");
          off.width = cv.width; off.height = cv.height;
          const g = off.getContext("2d");
          g.drawImage(cv, 0, 0);
          const [r, gg, b, a] = g.getImageData(cv.width >> 1, cv.height >> 1, 1, 1).data;
          say(`PROBE center_pixel=rgba(${r},${gg},${b},${a})`);
        } catch (e) { say(`PROBE center_pixel=err ${e}`); }
        say("PROBE done");
        document.title = "PROBE-DONE";
      }, 6000);
    </script>
  </body>
</html>
