[package]
name = "straf3-collision"
description = "Swept convex queries against static geometry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# BELOW THE LINE. Enforced by `cargo xtask check-seam`.
#
# straf3-sim is here to name the collision seam's own types — `World`, `Sweep`,
# `Trace`, `SurfaceFlags` — and its numeric types, so a hull's arithmetic is the
# simulation's arithmetic. It is not a cycle: straf3-sim depends on glam and
# nothing else, deliberately (see its manifest), and both crates are below the
# line.
#
# The dependency list is two entries long and stays that way. A geometry library
# — parry3d was the candidate — would be an architectural change, not a detail:
# ARCHITECTURE C8 requires the trace to be bit-identical across targets, so
# anything on the trace path has to be audited for that first. The tracer is
# hand-written precisely so that audit stays unnecessary; src/lib.rs says why.
[dependencies]
straf3-sim.workspace = true
glam.workspace = true
