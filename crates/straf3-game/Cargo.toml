[package]
name = "straf3-game"
description = "The straf3 executable: window, loop, glue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `rlib` so `harness` can test the glue as a library with no window and no GPU
# in the process — the same shape `straf3-headless` has over `straf3-sim`.
# `cdylib` because that is the only crate type `wasm-bindgen` can turn into a
# browser module.
[lib]
name = "straf3_game"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "straf3"
path = "src/main.rs"

# TOP OF THE STACK. Everything may be depended on from here; nothing may
# depend on here.
#
# `straf3-map` is here because the hardcoded arena is retired: the geometry the
# game plays in is now a compiled `.map`, and `scene.rs` is where it is chosen.
# It is NOT optional — the flat and empty worlds need no map, but the type that
# names them does, and a `--no-default-features` build must still parse
# `--map`.
#
# `straf3-devtools` used to be excluded here on the grounds that it depended on
# `egui-winit`, which depends on `arboard`, which has no `wasm32` backend at
# all. That is no longer true: wave 4 dropped `egui-winit` from that crate (the
# overlay takes no input, so it needs no windowing integration) and it builds
# for `wasm32-unknown-unknown`. It is optional here only because it draws into a
# frame, and `--no-default-features` has no frame.
[dependencies]
straf3-sim.workspace = true
straf3-map.workspace = true
# The `.s3d` format. Not optional: a personal best and the ghost it becomes are
# the point of a timed run, and a `--no-default-features` build still records
# and still saves one — it just cannot draw it.
straf3-replay.workspace = true
straf3-platform.workspace = true
winit.workspace = true
log.workspace = true

# Optional so the window, the input path and the fixed-tick loop can be built
# and tested with no GPU stack in the process at all — `--no-default-features`
# gives a window you can move in that draws nothing. That is what makes this
# crate's own tests runnable in CI on a machine with no adapter.
straf3-render = { workspace = true, optional = true }
# The on-screen overlay. Optional alongside `straf3-render` for the same
# reason: with `--no-default-features` there is no frame to draw one into.
straf3-devtools = { workspace = true, optional = true }
# Only to name `wgpu::Backends::BROWSER_WEBGPU` when handing the web build's
# backend choice to the renderer. No wgpu object is ever created here.
wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "Window"] }

[features]
default = ["render"]
# Draw the arena. Also selects the arena as the collision world, so what is
# drawn and what is collided with are the same geometry by construction.
render = ["dep:straf3-render", "dep:straf3-devtools", "dep:wgpu"]
