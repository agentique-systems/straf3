[workspace]
resolver = "3"
members = [
    # ── below the line: no rendering, no windowing, no GPU ──────────────
    "crates/straf3-sim",
    "crates/straf3-collision",
    "crates/straf3-map",
    "crates/straf3-replay",
    # ── above the line ──────────────────────────────────────────────────
    "crates/straf3-platform",
    "crates/straf3-render",
    "crates/straf3-devtools",
    "crates/straf3-game",
    # The records service. Above the line and firmly so — it links axum, sqlx
    # and a TLS stack. It depends *downward* on straf3-sim, straf3-replay and
    # straf3-map because verifying a submitted run means re-simulating it
    # (architecture decision D2), and the crates below the seam are pure and
    # headless, which is exactly what makes that legal.
    "crates/straf3-records",
    # ── automation ──────────────────────────────────────────────────────
    "xtask",
    # The cross-target determinism reference stream (architecture item C2).
    # A workspace member rather than a standalone crate like probes/ so it
    # resolves `glam` through this workspace's Cargo.lock: a check built
    # against a different resolution would be verifying a different tree.
    "tools/det-runner",
    # The screenshot tool (acceptance criterion 8). A member so the same
    # `cargo build --target x86_64-pc-windows-gnu` that produces the client
    # produces the instrument, and so `cargo test --workspace` on Linux still
    # covers the half of it that decides whether a capture is believed.
    "tools/straf3-capture",
    # The movement lab (spec D1): measures the movement language and publishes
    # the numbers. A workspace member for the same reason det-runner is — it
    # must measure the tree this Cargo.lock describes, not a neighbouring one.
    "tools/straf3-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.87 because wgpu 30.0.0 declares that MSRV. Cargo's MSRV-aware resolver
# silently caps wgpu at 26.0.1 if this says 1.85 — verified, not guessed.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

# Versions are declared once, here. Member crates say `foo.workspace = true`.
[workspace.dependencies]
# -- internal ---------------------------------------------------------------
straf3-sim = { path = "crates/straf3-sim" }
straf3-collision = { path = "crates/straf3-collision" }
straf3-map = { path = "crates/straf3-map" }
straf3-replay = { path = "crates/straf3-replay" }
straf3-platform = { path = "crates/straf3-platform" }
straf3-render = { path = "crates/straf3-render" }
straf3-devtools = { path = "crates/straf3-devtools" }

# -- external ---------------------------------------------------------------
# Every version below was checked against the registry, not guessed.

# Math. NEVER enable glam's `fast-math` feature: it permits reassociation and
# breaks the bit-identical results determinism depends on (spec section 4).
glam = "0.33.3"

# Swept convex-vs-static queries were going to come from parry3d, conditional on
# the determinism audit spec section 4 asks for. That audit never became worth
# running: straf3-collision answers the `World` seam with a hand-written Q3 brush
# tracer instead (see its src/lib.rs), so parry was declared and called by
# nothing. It is no longer a workspace dependency. Re-adding it means running the
# audit first — and, since C8 raised the bar to bit-identical *across targets*,
# auditing that too.

# Rigid bodies for props/doors/ragdolls ONLY. Deliberately not a dependency of
# any crate below the line, and never of straf3-sim: the character controller
# is hand-written, and keeping rapier out of the movement path is what keeps
# the seam check meaningful. Declared here so its version is agreed in advance.
rapier3d = "0.35.1"

# Valve 220 .map parsing already exists in Rust and is standalone; straf3-map
# spends its own code on the compile step (brushes -> convex hulls + render
# mesh) instead of re-implementing a parser.
quake-map = "0.6.1"

serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
bytemuck = "1.25.2"
pollster = "1.0.1"

# Above the line only. egui's three crates move in lockstep and must stay
# version-matched to each other.
winit = "0.30.13"        # stable ApplicationHandler API, NOT the 0.31 beta
wgpu = "30.0.0"          # requires rust-version 1.87, set above
egui = "0.36.1"
egui-wgpu = "0.36.1"
egui-winit = "0.36.1"
gltf = "1.4.1"           # render meshes; loading is above the line

# Logging. Above the line only — the simulation prints nothing, ever.
log = "0.4.33"
env_logger = "0.11.11"   # native only

# Web. Versions are exactly the ones probes/wasm-render measured its 132 KiB
# bundle with, and `wasm-bindgen` must stay in lockstep with the installed
# `wasm-bindgen-cli` (0.2.127 here) or the generated glue refuses to load.
# Each crate adds the `web-sys` features it needs on top of this line.
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = "0.3.104"
js-sys = "0.3.104"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"

# The records service. Above the line, and every one of these is unreachable
# from below it — `cargo xtask check-seam` is what says so rather than this
# comment. Versions are what cargo's MSRV-aware resolver picks against the
# `rust-version` above, which is why sqlx is 0.8 and not 0.9 (0.9 declares
# 1.94) and jsonwebtoken is 10 and not 11 (11 declares 1.88).
#
# Every TLS path here is rustls over *ring*, deliberately: the default
# `aws-lc-rs` provider needs cmake and a C toolchain to build, and a records
# service that cannot be built without them is a records service nobody on
# this team can build.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
# EdDSA only — the Neon Auth JWKS signs Ed25519 (OKP), verified against the
# live endpoint, not assumed. `rust_crypto` keeps that pure Rust.
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.11.0"
zstd = "0.13.3"
serde_json = "1.0.151"
http-body-util = "0.1.3"
tower = "0.5.2"
base64 = "0.23.1"
# Test-only, so `straf3-records`'s integration tests can mint an Ed25519 JWT and
# the JWK that verifies it. Never a runtime dependency: verification goes
# through `jsonwebtoken`, against keys the auth endpoint published.
ed25519-dalek = { version = "2.2.0", features = ["pkcs8"] }

[profile.dev]
opt-level = 1        # the simulation is unusable to feel at opt-level 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# What the browser build actually ships. Separate from `release` because the
# two have opposite objectives: a native release wants the fastest code, a web
# release wants the smallest download, and `opt-level = "z"` trades one for the
# other.
#
# Measured on the real stage-D bundle rather than assumed, and the honest
# number is smaller than the folklore: the same bundle is 168 597 B gzipped
# under plain `release` and 160 622 B here — 7 975 B, 4.7 % of the wasm. Worth
# keeping because it costs a visitor nothing and costs us only a build profile,
# but it is not where the bundle's weight is. `wasm-opt -Oz` runs afterwards
# either way and is doing most of the work these settings are usually credited
# with.
#
# `panic = "abort"` removes the unwinding tables; `console_error_panic_hook`
# still reports the panic to the console first, because a panic hook runs
# before the abort. `strip` drops the symbol names, which are what wasm-opt
# cannot remove and what a browser never reads.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
